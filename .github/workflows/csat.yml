name: 'CSAT survey for ADK-Python'
on:
  issues:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  welcome:
    name: Run CSAT survey script
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required for csat script to comment on closed issues
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false
      - uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325 # v6
        with:
          script: |
            const script = require('./.github/scripts/csat.js')
            script({github, context})
